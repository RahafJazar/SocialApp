<div class="flex justify-center">

    <p-dialog [visible]="visible" (visibleChange)="visible = $event; visibleChange.emit($event)" [modal]="true"
        [header]="title" [style]="{ width: width, maxWidth: '95vw'   }" styleClass="bgColorChange">
        <!----محتوى الديالوج-->
        <ng-content></ng-content>

        <!----الأزرار-->
        <ng-template #footer>
            <ng-content select="[dialogFooter]"></ng-content>
        </ng-template>
    </p-dialog>
</div>

<div class="inline-flex gap-1 rounded-lg border border-slate-200 bg-white p-1 text-sm"
    role="group" [attr.aria-label]="'LANGUAGE.SELECT' | translate">
  <button type="button" lang="en" (click)="change('en')"
      class="rounded-md px-2 py-1 text-slate-700"
      [class.bg-blue-100]="translateService.getCurrentLang() === 'en'"
      [attr.aria-pressed]="translateService.getCurrentLang() === 'en'">English</button>
  <button type="button" lang="ar" (click)="change('ar')"
      class="rounded-md px-2 py-1 text-slate-700"
      [class.bg-blue-100]="translateService.getCurrentLang() === 'ar'"
      [attr.aria-pressed]="translateService.getCurrentLang() === 'ar'">العربية</button>
</div>
